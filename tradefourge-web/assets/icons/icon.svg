<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="tfCardBg" x1="0" y1="28" x2="0" y2="484" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#11263E"/>
      <stop offset="55%" stop-color="#0E2036"/>
      <stop offset="100%" stop-color="#0A1829"/>
    </linearGradient>
    <linearGradient id="tfCardStroke" x1="0" y1="28" x2="0" y2="484" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#254768"/>
      <stop offset="100%" stop-color="#203C58"/>
    </linearGradient>
    <linearGradient id="tfCandleBlue" x1="0" y1="130" x2="0" y2="336" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#4D9CFF"/>
      <stop offset="100%" stop-color="#3788FD"/>
    </linearGradient>
    <linearGradient id="tfCoinFill" x1="0" y1="272" x2="0" y2="428" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0E2138"/>
      <stop offset="100%" stop-color="#0B1A2D"/>
    </linearGradient>
    <linearGradient id="tfCoinRing" x1="0" y1="270" x2="0" y2="430" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#286FE5"/>
      <stop offset="100%" stop-color="#1F5DD0"/>
    </linearGradient>
    <linearGradient id="tfDollarGrad" x1="0" y1="275" x2="0" y2="425" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#76B6FF"/>
      <stop offset="100%" stop-color="#4C9BFF"/>
    </linearGradient>
  </defs>

  <!-- Rounded Square Badge -->
  <rect x="28" y="28" width="456" height="456" rx="100" fill="url(#tfCardBg)" stroke="url(#tfCardStroke)" stroke-width="2.5"/>

  <!-- Candle 1 -->
  <rect x="132.5" y="223.5" width="13" height="40" rx="6.5" fill="#B8DDFF"/>
  <rect x="116" y="258" width="46" height="76" rx="11" fill="url(#tfCandleBlue)"/>

  <!-- Candle 2 -->
  <rect x="214.5" y="151.5" width="13" height="38" rx="6.5" fill="#B8DDFF"/>
  <rect x="198" y="184.5" width="46" height="81" rx="11" fill="url(#tfCandleBlue)"/>

  <!-- Candle 3 -->
  <rect x="296.5" y="101.5" width="13" height="36" rx="6.5" fill="#B8DDFF"/>
  <rect x="280" y="132" width="46" height="78" rx="11" fill="url(#tfCandleBlue)"/>

  <!-- Upward Trend Arrow (behind coin) -->
  <g fill="none" stroke="#8ED0FF" stroke-width="14.5" stroke-linecap="round" stroke-linejoin="round">
    <line x1="104.5" y1="365" x2="368.5" y2="190"/>
    <polyline points="312,190 368.5,190 368.5,246"/>
  </g>

  <!-- Foreground Coin & Dollar Sign -->
  <circle cx="256" cy="350" r="78" fill="url(#tfCoinFill)" stroke="url(#tfCoinRing)" stroke-width="14"/>
  <rect x="249.25" y="275" width="13.5" height="149.5" rx="6.75" fill="url(#tfDollarGrad)"/>
  <path d="M 284 316 C 279 302 267 297 254 297 C 232 297 217 308 217 323 C 217 340 234 345 256 350 C 278 355 295 362 295 380 C 295 397 278 406 254 406 C 235 406 218 399 208 386"
        fill="none" stroke="url(#tfDollarGrad)" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
