<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TradeFourge Companion</title>
  <link rel="stylesheet" href="styles/popup.css">
</head>
<body>
  <div class="header">
    <div class="header-icon">
      <svg viewBox="0 0 24 24">
        <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/>
      </svg>
    </div>
    <div class="title-group">
      <h1>TradeFourge Companion</h1>
      <span class="version-tag">Version 1.1</span>
    </div>
  </div>

  <div class="status-grid">
    <div class="status-card">
      <span class="card-label">Status</span>
      <span class="card-value" id="ext-status">
        <span class="badge-dot"></span>
        Extension Loaded
      </span>
    </div>

    <div class="status-card">
      <span class="card-label">Website</span>
      <span class="card-value" id="site-status">
        <span class="badge-dot disconnected" id="site-dot"></span>
        <span id="site-text">Checking...</span>
      </span>
    </div>
  </div>

  <div class="metrics-grid">
    <div class="metric-box full-width">
      <span class="metric-label">Messages</span>
      <span class="metric-val" id="cnt-total">0</span>
    </div>
    <div class="metric-box">
      <span class="metric-label">Ticks</span>
      <span class="metric-val" id="cnt-ticks">0</span>
    </div>
    <div class="metric-box">
      <span class="metric-label">Orders</span>
      <span class="metric-val" id="cnt-orders">0</span>
    </div>
    <div class="metric-box">
      <span class="metric-label">Deals</span>
      <span class="metric-val" id="cnt-deals">0</span>
    </div>
    <div class="metric-box">
      <span class="metric-label">Positions</span>
      <span class="metric-val" id="cnt-positions">0</span>
    </div>
    <div class="metric-box full-width">
      <span class="metric-label">Account Updates</span>
      <span class="metric-val" id="cnt-accounts">0</span>
    </div>
  </div>

  <div class="footer">
    TradeFourge Event Pipeline v1.1 Active
  </div>

  <script src="utils/validator.js"></script>
  <script src="utils/storage.js"></script>
  <script src="popup.js"></script>
</body>
</html>
