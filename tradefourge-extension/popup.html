<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TradeFourge Companion</title>
  <link rel="stylesheet" href="styles/popup.css">
</head>
<body>
  <div class="header">
    <div class="header-icon">
      <svg viewBox="0 0 24 24">
        <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/>
      </svg>
    </div>
    <div class="title-group">
      <h1>TradeFourge Companion</h1>
      <span class="version-tag">Version 1.2</span>
    </div>
  </div>

  <div class="status-grid">
    <div class="status-card">
      <span class="card-label">Connection</span>
      <span class="card-value" id="site-status">
        <span class="badge-dot disconnected" id="site-dot"></span>
        <span id="site-text">Checking...</span>
      </span>
    </div>
  </div>

  <div class="metrics-grid">
    <div class="metric-box full-width">
      <span class="metric-label">Messages</span>
      <span class="metric-val" id="cnt-total">0</span>
    </div>
    <div class="metric-box">
      <span class="metric-label">Open Trades</span>
      <span class="metric-val" id="cnt-open-trades">0</span>
    </div>
    <div class="metric-box">
      <span class="metric-label">Floating P/L</span>
      <span class="metric-val" id="cnt-floating-pnl">$0.00</span>
    </div>
    <div class="metric-box">
      <span class="metric-label">Current Spread</span>
      <span class="metric-val" id="cnt-spread">0.00</span>
    </div>
    <div class="metric-box">
      <span class="metric-label">Win Rate</span>
      <span class="metric-val" id="cnt-win-rate">0.0%</span>
    </div>
    <div class="metric-box full-width">
      <span class="metric-label">Drawdown</span>
      <span class="metric-val" id="cnt-drawdown">0.00%</span>
    </div>
  </div>

  <div class="footer">
    Runtime Intelligence Engine v1.2 Active
  </div>

  <script src="utils/validator.js"></script>
  <script src="utils/storage.js"></script>
  <script src="popup.js"></script>
</body>
</html>
