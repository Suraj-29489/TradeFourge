[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tradeforge-mt5-connector"
version = "1.0.0"
description = "TradeForge MetaTrader 5 Desktop Companion Connector"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "TradeForge Deepmind Team", email = "support@tradefourge.com" }
]
dependencies = [
    "MetaTrader5>=5.0.45",
    "httpx>=0.27.0",
    "keyring>=25.0.0",
    "python-dotenv>=1.0.0"
]

[project.scripts]
tradeforge-mt5 = "app.main:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
